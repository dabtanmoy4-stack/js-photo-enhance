<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>JS Photo Enhance | AI & High-Precision Canvas Photo Editor</title>
    <meta name="description" content="Professional-grade photo enhancement web app built with Jetpack Compose Material 3 design, real-time HTML5 Canvas GPU filters, AI neural upscaling, and multi-format exports (PNG, JPG, WEBP)." />
    <meta name="keywords" content="photo editor, photo enhance, AI image upscaler, canvas editor, jetpack compose web, photo filters, image quality enhancer" />
    <meta name="author" content="JS Photo Studio" />
    <meta name="theme-color" content="#10b981" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="JS Photo Enhance | Professional Canvas & AI Photo Editor" />
    <meta property="og:description" content="Enhance photos with real-time canvas adjustments, HDR tone curve, neural AI sharpening, and high-res exports." />
    <meta property="og:image" content="/pwa-512.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="JS Photo Enhance" />
    <meta name="twitter:description" content="Real-time web photo editor with pro filters, AI upscaling, and project history." />

    <!-- PWA Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/pwa-192.png" />
  </head>
  <body class="bg-zinc-950 text-zinc-100 antialiased selection:bg-emerald-500 selection:text-black">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol === 'https:') {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.log('ServiceWorker registration skipped:', err);
          });
        });
      }
    </script>
  </body>
</html>
